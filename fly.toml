# fly.toml app configuration file generated for re-sumo on 2026-03-26T10:50:38+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 're-sumo'
primary_region = 'fra'

[build]

[env]
  PORT = '8080'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpus = 1
  memory_mb = 256
