[package]
name = "resumo"
description = "Minimalist resume builder with JSONresume compatibility."
authors = ["Andrea Pavoni <andrea.pavoni@gmail.com>"]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/andreapavoni/resumo"
keywords = ["resume", "resume-builder", "pdf"]


[profile.release]
lto = "fat"
codegen-units = 1
strip = "none"
panic = "unwind"
incremental = false
opt-level = 3
debug = 1
overflow-checks = false

# Optimize dependencies with the same settings
[profile.release.package."*"]
opt-level = 3
codegen-units = 1
strip = "symbols"
debug = false


[dependencies]
anyhow = "1"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
askama = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }

[dev-dependencies]
tower = "0.5"
http-body-util = "0.1"
