<div class="skill-entry entry-group" id="skill-entry-{{ index }}">
  <div class="entry-header">
    <span class="entry-title">Skill Group #{{ index + 1 }}</span>
    <button type="button"
            hx-post="/entry/remove"
            hx-target="#skill-entry-{{ index }}"
            hx-swap="outerHTML">Remove</button>
  </div>
  <div class="field-row">
    <label>Category <input type="text" name="skills[{{ index }}].name" placeholder="Programming Languages" /></label>
    <label>Level <input type="text" name="skills[{{ index }}].level" placeholder="Advanced" /></label>
  </div>
  <label>Keywords (comma-separated) <textarea name="skills[{{ index }}].keywords" rows="2" placeholder="Rust, Python, TypeScript"></textarea></label>
</div>
